repos:
  # Local hooks to run our Python validators
  - repo: local
    hooks:
      - id: validate-structure
        name: Validate project structure
        entry: python tools/validate_structure.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: validate-plan
        name: Validate plan alignment
        entry: python tools/validate_plan.py
        args: ["--allow-prefix=📝 docs(kickoff)", "--allow-trailer=skip-plan-check:true"]
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: tech-debt-sync-check
        name: tech-debt sync (check)
        entry: python tools/tech_debt.py sync --dry-run
        language: system
        pass_filenames: false
        files: ^(TECH_DEBT\.md|meta/plan\.yml)$
      
      - id: docs-refresh
        name: rebuild SCRIPTS.md (check)
        entry: python
        language: system
        pass_filenames: false
        files: ^(tools/|scripts/)
        args:
          - tools/docgen_scripts.py
          - --out
          - docs/SCRIPTS.md
          - --check
          - --repo-url
          - https://github.com/yemiajibola23/court-iq-api
          - --default-branch
          - dev

      - id: commit-effects
        name: Sync ROADMAP subtasks & TECH_DEBT from commit message
        entry: python tools/commit_effects.py
        language: system
        stages: [post-commit]